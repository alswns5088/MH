<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>민혁 인사발령 예측본부</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* Layout: 공문(official notice) paper. Map sheet left, 집계표 right; stacks on phones. */
/* Layout: 알림장 카드 두 장(지도/집계표)이 파스텔 낙서 배경 위에 떠 있는 구성. */
:root{
  --paper:#fff3f6; --ink:#2b2340; --ink-2:#6f6587; --line:#f0d8e4; --sheet:#ffffff;
  --stamp:#ff4f7a; --stamp-soft:#ffe1ea; --accent:#5b52e0; --accent-soft:#e6e3ff; --me:#fff3b0;
  --sea:#e3f3ff; --land:#dff5e3; --land-line:#7fbf95; --bgimg:var(--tile-light);
  --display:'Black Han Sans',"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif; --body:'Noto Sans KR',"Apple SD Gothic Neo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1d1a2e; --ink:#f3eefb; --ink-2:#b2a9c9; --line:#3a3452; --sheet:#272240;
  --stamp:#ff6f95; --stamp-soft:#4a2a3a; --accent:#a9a3ff; --accent-soft:#332f55; --me:#4a4322;
  --sea:#20283d; --land:#2e4036; --land-line:#7fbf95; --bgimg:var(--tile-dark); color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#1d1a2e; --ink:#f3eefb; --ink-2:#b2a9c9; --line:#3a3452; --sheet:#272240;
  --stamp:#ff6f95; --stamp-soft:#4a2a3a; --accent:#a9a3ff; --accent-soft:#332f55; --me:#4a4322;
  --sea:#20283d; --land:#2e4036; --land-line:#7fbf95; --bgimg:var(--tile-dark); color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper) var(--bgimg) 0 0/280px 280px repeat;color:var(--ink);font-family:var(--body);font-weight:500;font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--sheet);border:3px solid var(--ink);border-radius:18px;padding:16px 20px;box-shadow:6px 6px 0 var(--stamp-soft)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-2)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,7vw,46px);margin:2px 0 0;line-height:1.1;letter-spacing:-.01em;text-wrap:balance;word-break:keep-all}
.docno{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stamp{font-family:var(--display);font-weight:400;color:var(--stamp);border:3px double var(--stamp);border-radius:6px;padding:4px 10px;font-size:18px;letter-spacing:.2em;transform:rotate(-8deg);opacity:.9;white-space:nowrap}

.grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px;align-items:start}
@media (max-width:760px){
  .grid{grid-template-columns:minmax(0,1fr)}
  header{position:relative;padding-right:92px}
  .stamp{position:absolute;right:14px;top:14px;font-size:15px;padding:3px 8px}
  svg{max-height:none}
  body{padding-bottom:170px}
  .btns{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--sheet);border-top:3px solid var(--ink);
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .btns .push{padding:9px 6px 6px}
}

.sheet{background:var(--sheet);border:3px solid var(--ink);border-radius:18px;padding:16px;box-shadow:6px 6px 0 var(--accent-soft)}
.sheet h2{font-family:var(--body);font-weight:900;font-size:17px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sheet h2 small{font-family:var(--body);font-weight:400;font-size:12px;color:var(--ink-2)}

.mapbox{background:var(--sea);border:2px solid var(--line);border-radius:14px;overflow:hidden}
svg{display:block;width:100%;height:auto;max-height:70vh}
.land{fill:var(--land);stroke:var(--land-line);stroke-width:1.2;stroke-linejoin:round}
.city-dot{fill:var(--sheet);stroke:var(--accent);stroke-width:2}
.city-dot.active{stroke:var(--stamp)}
.city-label{font-family:var(--body);font-size:14px;font-weight:900;fill:var(--ink)}
.city-sub{font-size:9px;fill:var(--ink-2)}
.ref{fill:var(--land-line)}
.ref-label{font-size:9px;fill:var(--ink-2)}
#face{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){#face{transition:none}}
.face-ring{fill:none;stroke:var(--stamp);stroke-width:3}
.face-tag{font-size:11px;font-weight:700;fill:var(--sheet)}
.face-tagbg{fill:var(--stamp)}
.sea-note{font-size:9px;fill:var(--ink-2)}

.status{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:10px 0 8px}
.status b{color:var(--ink)}

.btns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:420px){.btns{grid-template-columns:repeat(2,minmax(0,1fr))}}
.push{font-family:var(--body);font-size:16px;font-weight:900;color:var(--ink);background:var(--sheet);border:2px solid var(--ink);border-radius:12px;padding:12px 6px 8px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.push small{font-size:11px;font-weight:400;color:var(--ink-2);font-variant-numeric:tabular-nums}
.push:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);background:var(--accent-soft)}
.push:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.push.arrived{border-color:var(--stamp);color:var(--stamp)}
.push:disabled{opacity:.5;cursor:not-allowed}

table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:700;color:var(--ink-2);font-size:12px}
th:first-child,td:first-child{text-align:left}
td:first-child{max-width:110px;overflow:hidden;text-overflow:ellipsis}
td.total{font-weight:900}
tr.me td{background:var(--me)}
.empty{color:var(--ink-2);font-size:13px;padding:10px 0}
.tablewrap{overflow-x:auto}

.last{margin-top:12px;padding:10px 12px;background:var(--stamp-soft);border-radius:10px;font-size:13px}
.last b{font-weight:900}

.foot{font-size:12px;color:var(--ink-2);background:var(--sheet);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.linkbtn{font:inherit;color:var(--accent);background:none;border:none;padding:0;cursor:pointer;text-decoration:underline}
.notice{background:var(--accent-soft);border:2px solid var(--accent);border-radius:12px;padding:8px 12px;font-size:13px}

/* 입장 */
.gate{position:fixed;inset:0;background:color-mix(in srgb,var(--paper) 88%,transparent);display:flex;align-items:center;justify-content:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate form{background:var(--sheet);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--stamp-soft);padding:22px 20px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.gate h2{font-family:var(--display);font-weight:400;margin:0;font-size:26px}
.gate p{margin:0;font-size:13px;color:var(--ink-2)}
.gate input{font:inherit;font-size:17px;padding:10px 12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px}
.gate input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.gate button{font:inherit;font-weight:900;font-size:16px;padding:12px;background:var(--stamp);color:#fff;border:none;border-radius:12px;cursor:pointer}
.gate button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">인사발령 예측본부 · 대구지점 발</div>
      <h1>민혁이는 어디로 가는가</h1>
      <div class="docno" id="docno">인사-2026-1020호 · 발령 예정지 미정</div>
    </div>
    <div class="stamp">발 령</div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <div class="grid">
    <section class="sheet">

  const house=(x,y,c,r)=>`<g><rect x="${x}" y="${y+16}" width="34" height="26" rx="4" fill="${c}"/><path d="M${x-4} ${y+18} L${x+17} ${y} L${x+38} ${y+18} Z" fill="${r}"/><rect x="${x+13}" y="${y+28}" width="9" height="14" rx="2" fill="${r}"/></g>`;
  const heart=(x,y,c)=>`<path transform="translate(${x} ${y})" d="M0 10 C-14 -2 -6 -14 0 -6 C6 -14 14 -2 0 10 Z" fill="${c}"/>`;
  const dots=(c)=>[[30,150],[250,60],[140,250],[70,260],[262,180],[120,20],[200,245],[14,230]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="${c}"/>`).join('');
  const star=(x,y,c)=>`<path transform="translate(${x} ${y})" d="M0 -11 L3.2 -3.5 L11 -3.5 L4.8 1.5 L7 9 L0 4.5 L-7 9 L-4.8 1.5 L-11 -3.5 L-3.2 -3.5 Z" fill="${c}"/>`;
  const make=(a,pink,yellow,mint,blue,emojiOp)=>`<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280" opacity="${a}">`
    +cloud(24,40,blue)+cloud(200,214,blue)
    +house(176,28,yellow,pink)+house(40,196,mint,pink)
    +heart(110,96,pink)+heart(236,120,pink)+star(90,160,yellow)+star(254,264,yellow)+dots(mint)
    +`<g opacity="${emojiOp}">`+E(120,40,'📦',28)+E(16,120,'🚚',30,-8)+E(190,100,'🧳',24,10)+E(148,214,'🐣',26)+E(244,170,'🍎',22)+E(66,246,'🌸',22)+E(214,268,'⭐',18)+E(104,276,'🚌',24)+'</g></svg>';
  const url=s=>`url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(s)}")`;
  const r=document.documentElement.style;
  r.setProperty('--tile-light',url(make(0.9,'#ffb8cc','#ffe58f','#b8ecd0','#c7dcff',1)));
  r.setProperty('--tile-dark',url(make(0.55,'#ff8fb0','#ffd86b','#8fd9b4','#9fbdff',0.85)));
})();
</script>
<script>
// ---- 지도: 위경도 → viewBox 좌표 ----
const px=(lat,lon)=>[+((lon-125.9)*88).toFixed(1), +((38.9-lat)*110).toFixed(1)];
const outline=[[37.77,126.68],[37.95,126.95],[38.10,127.10],[38.30,127.60],[38.32,128.00],[38.60,128.35],[38.20,128.60],[37.75,128.95],[37.45,129.17],[37.05,129.42],[36.55,129.43],[36.08,129.57],[35.95,129.43],[35.50,129.45],[35.20,129.25],[35.08,129.05],[35.05,128.80],[34.85,128.70],[34.70,128.60],[34.85,128.40],[34.78,128.10],[34.70,127.90],[34.70,127.70],[34.50,127.35],[34.65,127.15],[34.45,126.95],[34.30,126.70],[34.30,126.50],[34.55,126.30],[34.80,126.35],[35.05,126.30],[35.35,126.40],[35.60,126.48],[35.98,126.62],[36.20,126.55],[36.40,126.50],[36.70,126.15],[36.95,126.35],[37.00,126.65],[36.95,126.85],[37.20,126.72],[37.45,126.60],[37.65,126.55]];
document.getElementById('land').setAttribute('d','M'+outline.map(p=>px(...p).join(',')).join('L')+'Z');

const REGIONS=['진천','순천','춘천','대구'];
const CITY={진천:{ll:[36.86,127.44],sub:'충북'},순천:{ll:[34.95,127.49],sub:'전남'},춘천:{ll:[37.88,127.73],sub:'강원'},대구:{ll:[35.87,128.60],sub:'현 근무지'}};
for(const k in CITY){CITY[k].xy=px(...CITY[k].ll)}
const SEOUL=px(37.57,126.98);
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const STEP=dist(CITY.대구.xy,CITY.순천.xy)/100;   // 100번 = 대구→순천

const SVGNS='http://www.w3.org/2000/svg';
const el=(t,a={},txt)=>{const n=document.createElementNS(SVGNS,t);for(const k in a)n.setAttribute(k,a[k]);if(txt!=null)n.textContent=txt;return n};
const cities=document.getElementById('cities');
cities.append(el('circle',{class:'ref',cx:SEOUL[0],cy:SEOUL[1],r:2}),el('text',{class:'ref-label',x:SEOUL[0]-6,y:SEOUL[1]-6},'서울'));
const dots={};
for(const k of REGIONS){const [x,y]=CITY[k].xy;
  dots[k]=el('circle',{class:'city-dot',cx:x,cy:y,r:5});
  const lx=k==='춘천'||k==='진천'?x-10:x+10, anchor=k==='춘천'||k==='진천'?'end':'start';
  cities.append(dots[k],el('text',{class:'city-label',x:lx,y:y+5,'text-anchor':anchor},k),el('text',{class:'city-sub',x:lx,y:y+17,'text-anchor':anchor},CITY[k].sub));
}

// ---- 상태 ----
let pos=[...CITY.대구.xy], lastRegion='대구', lastBy='';
let me=null;            // {id,name,counts:{},total}
let db=null, docRef=null;
let pending=false, flushTimer=null, writing=false;
const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

function renderPos(){
  $('face').setAttribute('transform',`translate(${pos[0].toFixed(1)},${pos[1].toFixed(1)})`);
  let near='대구',best=1e9;
  for(const k of REGIONS){const d=dist(pos,CITY[k].xy);if(d<best){best=d;near=k}
    const left=Math.ceil(d/STEP);const b=btn[k];
    b.querySelector('small').textContent=left===0?'도착!':`${left}번 남음`;
    b.classList.toggle('arrived',left===0);
    dots[k].classList.toggle('active',left===0);
  }
  $('near').textContent=best<STEP*1.5?near:near+' 쪽';
  $('moved').textContent=Math.round(dist(pos,CITY.대구.xy)/STEP);
  const arrived=REGIONS.find(k=>dist(pos,CITY[k].xy)<0.01);
  $('docno').textContent='인사-2026-1020호 · '+(arrived?`발령 예정지 ${arrived} (확정)`:'발령 예정지 미정');
  $('last').hidden=!lastBy;
  if(lastBy)$('last').innerHTML=`마지막으로 민 사람 <b>${esc(lastBy)}</b> → ${esc(lastRegion)} 방향`;
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const btn={};
for(const k of REGIONS){const b=document.createElement('button');b.className='push';b.type='button';b.id='push-'+k;
  b.innerHTML=`${k}으로<small>…</small>`.replace('으로',k==='진천'||k==='순천'||k==='춘천'?'으로':'로');
  b.addEventListener('click',()=>push(k));$('btns').append(b);btn[k]=b}

function push(k){
  if(!me)return;
  const t=CITY[k].xy,d=dist(pos,t);
  if(d>0.01){const r=Math.min(1,STEP/d);pos=[pos[0]+(t[0]-pos[0])*r,pos[1]+(t[1]-pos[1])*r];}
  lastRegion=k;lastBy=me.name;
  me.counts[k]=(me.counts[k]||0)+1;me.total++;delta[k]=(delta[k]||0)+1;
  renderPos();renderBoard();
  pending=true;clearTimeout(flushTimer);flushTimer=setTimeout(flush,350);
}
let delta={};
async function flush(){
  if(!fs||!docRef||writing){if(writing)flushTimer=setTimeout(flush,300);return}
  writing=true;pending=false;
  const d=delta;delta={};
  try{
    await fs.doc('state/position').set({x:pos[0],y:pos[1],lastRegion,lastBy,at:Date.now()});
    const inc=firebase.firestore.FieldValue.increment;
    const upd={name:me.name,at:Date.now(),total:inc(Object.values(d).reduce((a,b)=>a+b,0))};
    for(const k in d)upd[k]=inc(d[k]);
    await docRef.set(upd,{merge:true});
  }catch(e){for(const k in d)delta[k]=(delta[k]||0)+d[k];showNotice('저장에 실패했어요. 인터넷 연결이나 Firestore 규칙을 확인해 주세요.');}
  writing=false;
  if(pending||Object.keys(delta).length)flush();
}

// ---- 집계표 ----
let players=[];
function renderBoard(){
  const list=players.filter(p=>!me||p.id!==me.id).map(p=>({id:p.id,...p.data()}));
  if(me)list.push({id:me.id,name:me.name,...me.counts,total:me.total});
  list.sort((a,b)=>(b.total||0)-(a.total||0)||String(a.name).localeCompare(String(b.name)));
  $('rows').innerHTML=list.map(p=>`<tr class="${me&&p.id===me.id?'me':''}"><td title="${esc(p.name)}">${esc(p.name)}</td>${REGIONS.map(k=>`<td>${p[k]||0}</td>`).join('')}<td class="total">${p.total||0}</td></tr>`).join('');
  $('empty').hidden=list.length>0;
  $('pcount').textContent=`${list.length}명 참여`;
}

function showNotice(msg){$('notice').textContent=msg;$('notice').hidden=false}

// ---- 입장 ----
async function enter(name){
  name=name.trim().slice(0,12);if(!name)return;
  store.set('mh_name',name);
  me={id:store.get('mh_pid')||'local',name,counts:{},total:0};
  $('gate').hidden=true;$('who').textContent=`${name} 님 접속 중`;
  if(fs){
    try{
      const col=fs.collection('players');let snap=null;
      const pid=store.get('mh_pid');
      if(pid){const s=await col.doc(pid).get();if(s.exists&&s.data().name===name)snap=s}
      if(!snap){const q=await col.where('name','==',name).limit(1).get();if(!q.empty)snap=q.docs[0]}
      if(snap){docRef=col.doc(snap.id);const d=snap.data();me.id=snap.id;for(const k of REGIONS)me.counts[k]=d[k]||0;me.total=d.total||0}
      else{docRef=col.doc();await docRef.set({name,total:0,at:Date.now()});me.id=docRef.id}
      store.set('mh_pid',me.id);
    }catch(e){showNotice('명부에 등록하지 못했어요. 밀기는 되지만 기록이 남지 않을 수 있어요.');}
  }
  renderBoard();renderPos();
}
$('gateform').addEventListener('submit',e=>{e.preventDefault();enter($('name').value)});
$('rename').addEventListener('click',()=>{me=null;$('gate').hidden=false;$('name').value='';$('name').focus()});
const savedName=store.get('mh_name');if(savedName)$('name').value=savedName;

// ---- Firebase 연결 ----
// ▼▼ 여기에 Firebase 콘솔 > 프로젝트 설정 > 내 앱 > SDK 설정의 firebaseConfig를 붙여넣으세요 ▼▼
const firebaseConfig = {
  apiKey: "AIzaSyAzflPvr4uIDmmSfAOlszY_PVBfUxdF8Qo",
  authDomain: "mhbank-4d339.firebaseapp.com",
  projectId: "mhbank-4d339"
};
// ▲▲ 여기까지 ▲▲
renderPos();renderBoard();
let fs=null;
try{
  if(!firebaseConfig.projectId)throw new Error('config');
  firebase.initializeApp(firebaseConfig);fs=firebase.firestore();
  db={doc:p=>fs.doc(p),collection:p=>fs.collection(p)};
}catch(e){showNotice('Firebase 설정이 비어 있어 혼자만 보이는 연습 모드예요.');}
if(fs){
  fs.doc('state/position').onSnapshot(s=>{
    if(!s.exists||pending||writing)return;const d=s.data();
    if(typeof d.x==='number'){pos=[d.x,d.y];lastRegion=d.lastRegion||lastRegion;lastBy=d.lastBy||'';renderPos()}
  },e=>showNotice('위치 동기화가 끊겼어요. 새로고침해 주세요.'));
  fs.collection('players').orderBy('total','desc').limit(200).onSnapshot(s=>{players=s.docs;renderBoard()},e=>showNotice('집계표를 불러오지 못했어요. Firestore 규칙을 확인해 주세요.'));
  if(me&&!docRef)enter(me.name);
}
</script>
</body>
</html>
